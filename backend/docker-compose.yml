name: clinic-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic_app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - clinic_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_app -d clinic_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://clinic_app:changeme@db:5432/clinic_db?schema=public
      # Set real values before running in anything beyond local dev:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
      EMAIL_PROVIDER: mock
    volumes:
      - clinic_storage:/app/storage

volumes:
  clinic_db_data:
  clinic_storage:
